name: Frontend Release Deployment

# ==============================================================================
# TRIGGERS:
# 1. push: Triggers automatically when pushing/creating any branch matching 'release/*'
# 2. workflow_dispatch: Enables manual execution from the GitHub Web UI ("Run workflow" button)
# ==============================================================================
on:
  push:
    branches:
      - 'release/*'
      - 'release/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      runner:
        description: 'Runner label (use self-hosted for Azure runner or ubuntu-latest for fallback test)'
        required: true
        default: 'self-hosted'
        type: choice
        options:
          - self-hosted
          - ubuntu-latest

# Permissions configuration for security
permissions:
  contents: read
  id-token: write # Required if using Azure OIDC authentication

jobs:
  # ============================================================================
  # BUILD & TEST STAGE
  # ============================================================================
  build-and-test:
    name: Build & Verify React Frontend
    # Uses Azure runner (self-hosted). When triggered manually via UI, the selected runner is used.
    # Note: If your Azure runner has custom labels (e.g., [self-hosted, azure]), you can specify them here.
    runs-on: ${{ inputs.runner || 'self-hosted' }}

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install frontend dependencies
        run: |
          echo "Installing dependencies with npm ci..."
          npm ci

      - name: 4. Run frontend tests
        run: |
          echo "Running unit tests..."
          CI=true npm test -- --passWithNoTests

      - name: 5. Build production bundle
        run: |
          echo "Building React static assets..."
          npm run build

      - name: 6. Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: build/
          retention-days: 7

  # ============================================================================
  # DEPLOYMENT STAGE (Demo for Azure)
  # ============================================================================
  deploy:
    name: Deploy to Azure (Demo)
    needs: build-and-test
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    environment:
      name: ${{ inputs.environment || 'staging' }}

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Download production build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: build/

      - name: 3. Display Deployment Context
        run: |
          echo "=========================================================="
          echo "🚀 DEMO RELEASE DEPLOYMENT STARTED"
          echo "=========================================================="
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"
          echo "Target Environment: ${{ inputs.environment || 'staging' }}"
          echo "Executing on Runner: Azure Self-Hosted (${{ runner.name }})"
          echo "=========================================================="
          echo "Artifact contents:"
          ls -lh build/

      - name: 4. Simulate Azure Deployment
        run: |
          echo "🔑 Authenticating with Azure credentials (Demo placeholder)..."
          echo "☁️ Uploading build/ folder to Azure Static Web Apps / Blob Storage CDN..."
          sleep 3
          echo "✅ Frontend successfully deployed to Azure!"
          echo "🌐 Live URL: https://app.demo.internal"

      # ------------------------------------------------------------------------
      # REAL AZURE STATIC WEB APPS TEMPLATE (Uncomment when credentials are ready):
